<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VitalGuard Pro - Medical Intelligence</title>
    
    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #ef4444;
            --secondary: #3b82f6;
            --bg-light: #f8fafc;
            --card-light: rgba(255, 255, 255, 0.9);
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-light);
            transition: background-color 0.3s ease;
        }

        .glass-card { 
            background: var(--card-light);
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-active {
            background: rgba(255, 255, 255, 0.1);
            border-left: 4px solid var(--primary);
            color: white !important;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="flex flex-col md:flex-row min-h-screen">

    <nav class="w-full md:w-64 bg-slate-900 text-slate-400 flex flex-col p-6 z-50">
        <div class="flex items-center gap-3 mb-12">
            <div class="w-10 h-10 bg-red-500 rounded-xl flex items-center justify-center shadow-lg shadow-red-500/20">
                <i class="fas fa-heartbeat text-white text-xl"></i>
            </div>
            <div>
                <h1 class="text-white font-extrabold text-xl leading-none">VitalGuard</h1>
                <p class="text-[10px] uppercase tracking-widest font-bold text-slate-500">Analytics Pro</p>
            </div>
        </div>

        <div class="flex-1 space-y-2">
            <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-active flex items-center gap-4 w-full p-3 rounded-lg hover:bg-slate-800 transition text-sm font-medium">
                <i class="fas fa-chart-line w-5"></i> Dashboard
            </button>
            <button onclick="switchTab('history')" id="nav-history" class="flex items-center gap-4 w-full p-3 rounded-lg hover:bg-slate-800 transition text-sm font-medium">
                <i class="fas fa-history w-5"></i> History
            </button>
            <button onclick="switchTab('patients')" id="nav-patients" class="flex items-center gap-4 w-full p-3 rounded-lg hover:bg-slate-800 transition text-sm font-medium">
                <i class="fas fa-users w-5"></i> Patients
            </button>
        </div>
    </nav>

    <main class="flex-1 p-4 md:p-8 overflow-y-auto">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
            <div>
                <h2 id="tab-title" class="text-3xl font-black text-slate-800 tracking-tight">Real-time Vitals</h2>
                <div class="flex items-center gap-2 mt-1">
                    <span id="status-dot" class="w-2 h-2 bg-yellow-400 rounded-full animate-pulse"></span>
                    <p id="status-text" class="text-sm text-slate-500 font-medium tracking-wide">Syncing with hardware...</p>
                </div>
            </div>
        </header>

        <div id="tab-dashboard" class="tab-content active space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                <div class="glass-card p-6 rounded-3xl">
                    <h3 class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-4">Heart Rate</h3>
                    <div class="flex items-baseline gap-1">
                        <span id="val-hr" class="text-5xl font-black text-slate-800">--</span>
                        <span class="text-slate-400 font-bold text-lg">bpm</span>
                    </div>
                </div>
                <div class="glass-card p-6 rounded-3xl">
                    <h3 class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-4">SpO2 Level</h3>
                    <div class="flex items-baseline gap-1">
                        <span id="val-spo2" class="text-5xl font-black text-slate-800">--</span>
                        <span class="text-slate-400 font-bold text-lg">%</span>
                    </div>
                </div>
                <div class="glass-card p-6 rounded-3xl">
                    <h3 class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-4">Body Temp</h3>
                    <div class="flex items-baseline gap-1">
                        <span id="val-temp" class="text-5xl font-black text-slate-800">--</span>
                        <span class="text-slate-400 font-bold text-lg">°F</span>
                    </div>
                </div>
                <div class="glass-card p-6 rounded-3xl">
                    <h3 class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-4">Glucose</h3>
                    <div class="flex items-baseline gap-1">
                        <span id="val-glucose" class="text-5xl font-black text-slate-800">--</span>
                        <span class="text-slate-400 font-bold text-lg">mg/dL</span>
                    </div>
                </div>
            </div>

            <div class="glass-card p-8 rounded-[2.5rem]">
                <div class="h-[300px]">
                    <canvas id="liveChart"></canvas>
                </div>
            </div>
        </div>

        <div id="tab-history" class="tab-content text-center py-20 glass-card rounded-[2.5rem]">
            <h2 class="text-2xl font-bold text-slate-800">Medical Archives</h2>
            <p class="text-slate-400">Historical records will appear here.</p>
        </div>

        <div id="tab-patients" class="tab-content text-center py-20 glass-card rounded-[2.5rem]">
            <h2 class="text-2xl font-bold text-slate-800">Patient Directory</h2>
            <p class="text-slate-400">Manage patient profiles and data access.</p>
        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAsiM3Ha_FPz8O-OxtcZic-gX9bVnVOUFM",
            authDomain: "healthmonitor-cdf73.firebaseapp.com",
            databaseURL: "https://console.firebase.google.com/u/0/project/healthmonitor-cdf73/database/healthmonitor-cdf73-default-rtdb/data",
            projectId: "healthmonitor-cdf73",
            storageBucket: "healthmonitor-cdf73.firebasestorage.app",
            messagingSenderId: "599950246625",
            appId: "1:599950246625:web:38059c64f0c9bda3cd2da0"
        };

        let mainChart;
        const historyLimit = 30;
        
        function initChart() {
            const ctx = document.getElementById('liveChart').getContext('2d');
            mainChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Array(historyLimit).fill(''),
                    datasets: [{
                        label: 'Heart Rate',
                        data: Array(historyLimit).fill(0),
                        borderColor: '#ef4444',
                        tension: 0.4,
                        fill: true,
                        backgroundColor: 'rgba(239, 68, 68, 0.05)'
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, animation: false }
            });
        }

        function switchTab(tabId) {
            // Hide all contents
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            
            // Remove active classes from navigation buttons safely
            document.querySelectorAll('nav button').forEach(btn => {
                if (btn.id && btn.id.startsWith('nav-')) {
                    btn.classList.remove('nav-active');
                }
            });
            
            // Show target content
            const targetContent = document.getElementById(`tab-${tabId}`);
            const targetNav = document.getElementById(`nav-${tabId}`);
            
            if (targetContent) targetContent.classList.add('active');
            if (targetNav) targetNav.classList.add('nav-active');
            
            const titles = { dashboard: 'Real-time Vitals', history: 'Medical Archives', patients: 'Patient Directory' };
            document.getElementById('tab-title').innerText = titles[tabId] || 'Health Monitor';
        }

        function connectFirebase() {
            try {
                firebase.initializeApp(firebaseConfig);
                const db = firebase.database();
                document.getElementById('status-text').innerText = "Live Cloud Sync Active";
                document.getElementById('status-dot').className = "w-2 h-2 bg-green-500 rounded-full";

                db.ref('patient_vitals').on('value', (snap) => {
                    const data = snap.val();
                    if (data) updateDisplay(data);
                });
            } catch (err) {
                console.warn("Firebase Init Failed. Launching Simulation Mode.");
                startSimulation();
            }
        }

        function updateDisplay(data) {
            document.getElementById('val-hr').innerText = data.heart_rate || '--';
            document.getElementById('val-spo2').innerText = data.spo2 || '--';
            document.getElementById('val-temp').innerText = data.temp || '--';
            document.getElementById('val-glucose').innerText = data.glucose || '--';
            
            if(data.heart_rate) {
                mainChart.data.datasets[0].data.shift();
                mainChart.data.datasets[0].data.push(data.heart_rate);
                mainChart.update();
            }
        }

        function startSimulation() {
            setInterval(() => {
                const mock = { 
                    heart_rate: 70 + Math.floor(Math.random() * 20),
                    spo2: 98, temp: 98.6, glucose: 110 
                };
                updateDisplay(mock);
            }, 2000);
        }

        window.onload = () => {
            initChart();
            connectFirebase();
        };
    </script>
</body>
</html>
